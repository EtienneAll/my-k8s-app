apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-deployment
  namespace: dev
  annotations:
      circleci.com/project-id: e1ca1be6-273b-4b9f-9f41-3c18a4e404af
  labels:
      circleci.com/component-name: my-k8s-app
      circleci.com/version: 1.0.0
      app: my-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
        circleci.com/component-name: my-k8s-app
        circleci.com/version: 1.0.0
    spec:
      containers:
      - name: my-container
        image: etienneallard/my-k8s-app:dev
        ports:
        - containerPort: 3000
